<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha - ClinSecure</title>
</head>
<body>
    <h2>Esqueceu sua senha?</h2>
    <p>Digite seu endereço de e-mail abaixo e enviaremos um link para você redefinir sua senha.</p>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar link de recuperação</button>
    </form>
    
    <br>
    <a href="{% url 'login' %}">Voltar para o Login</a>
</body>
</html>
