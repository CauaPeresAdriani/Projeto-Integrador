{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}Login - Projeto Integrador{% endblock %}

{% block content %}
<header class="header">
    <div class="profile">
        <img src="{% static 'img/Profile.webp' %}" alt="ClinSecure Logo">
        <h2>ClinSecure</h2>
    </div>
    <nav>
        <a href="{% url 'home' %}">Início</a>
        <a href="{% url 'cadastro' %}">Cadastro</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'password_reset' %}">Esqueci a senha</a>
    </nav>
</header>

<div class="login-container">
    <div class="card shadow p-4 login-card">
        
        <h2 class="login-title">Tela de Login</h2>

        <form method="POST">
            {% csrf_token %} 
            
            <div class="form-group">
                <label for="username" class="labels">Usuário:</label>
                <input type="text" name="username" id="username" class="inputs" required>
            </div>

            <div class="form-group">
                <label for="password" class="labels">Senha:</label>
                <input type="password" name="password" id="password" class="inputs" required>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>

            <div class="form-links">
                <a href="{% url 'cadastro' %}">Criar conta</a>
                <a href="{% url 'password_reset' %}">Esqueci a senha</a>
            </div>
        </form>
        
        {% if erro %}
            <div class="alert-error" role="alert">
                {{ erro }}
            </div>
        {% endif %}

    </div>
</div>
{% endblock %}
